<?xml version="1.0" encoding="UTF-8"?>
<!--
  EasyDoneHandyman print logo.
  Green wrench/screwdriver mark (brand primary #38e07b) centred on a white circle.
  Canvas is 1000x1000; the area outside the circle is transparent so it can be
  placed on any garment colour. Source path is the same one used in BrandLogo.jsx.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!-- White circular background -->
  <circle cx="500" cy="500" r="500" fill="#ffffff"/>
  <!-- Icon: 24-unit path scaled to 560px (56% of diameter) and centred -->
  <g transform="translate(220 220) scale(23.333)">
    <path fill="#38e07b" d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/>
  </g>
</svg>
